<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Impostor forest</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #a9c3d6; font: 12px/1.4 ui-monospace, Menlo, monospace; }
      canvas { display: block; touch-action: none; cursor: grab; }
      canvas:active { cursor: grabbing; }
      #hud { position: fixed; top: 12px; left: 12px; padding: 10px 12px; border-radius: 6px; background: rgba(12, 18, 24, 0.72); color: #e8eef2; min-width: 230px; user-select: none; }
      #hud .row { display: flex; justify-content: space-between; gap: 16px; }
      #hud .label { color: #9fb0bc; }
      #hud fieldset { border: 0; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 2px; }
      #hud label { cursor: pointer; }
      #hud .hint { margin-top: 8px; color: #9fb0bc; }
      #progress { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #1d2a33; font-size: 14px; pointer-events: none; }
      body.auto #hud { display: none; }
    </style>
  </head>
  <body>
    <div id="progress">Loading…</div>
    <div id="hud" hidden>
      <div class="row"><span class="label">fps</span><span id="fps">–</span></div>
      <div class="row"><span class="label">draw calls</span><span id="calls">–</span></div>
      <div class="row"><span class="label">triangles</span><span id="tris">–</span></div>
      <div class="row"><span class="label">near real instances</span><span id="near">–</span></div>
      <div class="row"><span class="label">impostor instances</span><span id="total">–</span></div>
      <fieldset>
        <label><input type="radio" name="mode" value="hybrid" checked /> hybrid</label>
        <label><input type="radio" name="mode" value="impostor" /> impostors only</label>
        <label><input type="radio" name="mode" value="real" /> real only (within 250 m)</label>
      </fieldset>
      <fieldset>
        <label><input type="checkbox" id="band" /> show hand-off (impostors red, real blue)</label>
      </fieldset>
      <div class="hint">drag to look · WASD move · Q/E down/up · shift faster</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
