name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser and software GPU
        run: |
          pnpm --filter @drawcall/lod exec playwright install --with-deps chromium
          sudo apt-get install -y mesa-vulkan-drivers
      - run: pnpm check
      - name: Verify package artifacts
        run: pnpm --filter "./packages/*" -r pack --pack-destination "$RUNNER_TEMP/packages"
