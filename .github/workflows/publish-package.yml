name: Publish Package

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build, typecheck, and test
        run: pnpm check
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable release tag such as v0.1.0" >&2
            exit 1
          fi
          npm --prefix packages/impostor pkg set version="$version"
      - name: Copy package documentation
        run: |
          cp README.md packages/impostor/README.md
          cp LICENSE packages/impostor/LICENSE
      - name: Pack package
        run: pnpm --filter "./packages/*" -r pack --pack-destination "$RUNNER_TEMP/packages"
      - name: Publish
        run: npm publish "$RUNNER_TEMP/packages/drawcall-impostor-${RELEASE_TAG#v}.tgz" --access public --provenance --tag latest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
